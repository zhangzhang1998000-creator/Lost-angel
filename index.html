<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日跑店排行榜生成器 - 优化布局版</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans SC', sans-serif; background: #050308; color: #fff; display: flex; gap: 30px; padding: 30px; min-height: 100vh; align-items: flex-start; }
    
    /* 左侧控制面板 */
    .control-panel { width: 360px; background: #0f0914; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(228, 0, 117, 0.2); border: 1px solid rgba(228, 0, 117, 0.3); height: fit-content; position: sticky; top: 30px; }
    .control-panel h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #f8fafc; border-bottom: 1px solid rgba(228,0,117,0.3); padding-bottom: 12px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: #d1d5db; margin-bottom: 6px; font-weight: 500; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px 14px; background: #050308; border: 1px solid rgba(228,0,117,0.3); border-radius: 8px; color: #fff; outline: none; font-size: 13px; font-family: inherit; }
    .form-group input[type="file"] { padding: 8px 10px; cursor: pointer; }
    .form-group input:focus, .form-group textarea:focus { border-color: #e40075; box-shadow: 0 0 10px rgba(228, 0, 117, 0.4); }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; margin-top: 10px; font-size: 14px; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #e40075 0%, #900048 100%); color: #fff; box-shadow: 0 4px 15px rgba(228,0,117,0.4); }
    .btn-success { background: linear-gradient(135deg, #10b981 0%, #047857 100%); color: #fff; box-shadow: 0 4px 12px rgba(16,185,129,0.4); }
    .btn-batch { background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%); color: #fff; box-shadow: 0 4px 12px rgba(99,102,241,0.4); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; margin-top: 6px; font-size: 12px; padding: 6px; }

    /* 右侧预览与翻页控制器 */
    .preview-panel { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 15px; }
    .pagination-bar { display: flex; align-items: center; gap: 15px; background: #0f0914; padding: 8px 20px; border-radius: 30px; border: 1px solid rgba(228,0,117,0.3); }
    .page-btn { background: rgba(228,0,117,0.2); border: 1px solid #e40075; color: #fff; padding: 4px 12px; border-radius: 12px; cursor: pointer; font-size: 12px; font-weight: bold; }
    .page-btn:disabled { opacity: 0.3; cursor: not-allowed; }
    .page-info { font-family: 'Orbitron', sans-serif; font-size: 13px; color: #ff66b3; font-weight: 700; }

    /* 核心海报容器 */
    #poster { 
      width: 420px; 
      height: 840px; 
      background-color: #09030c; 
      color: #fff; 
      padding: 24px 20px 20px; 
      position: relative; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
      border-radius: 12px;
      border: 1px solid rgba(228, 0, 117, 0.4);
      box-shadow: 0 0 30px rgba(228, 0, 117, 0.2);
    }

    /* 背景图层 */
    .custom-bg-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: 0; display: none; }
    .bg-overlay { position: absolute; inset: 0; background: rgba(9, 3, 12, 0.75); pointer-events: none; z-index: 1; display: none; }
    .bg-light-1 { position: absolute; top: -100px; left: 50%; transform: translateX(-50%); width: 360px; height: 360px; background: radial-gradient(circle, rgba(228,0,117,0.35) 0%, rgba(0,0,0,0) 70%); pointer-events: none; z-index: 1; }
    .bg-light-2 { position: absolute; bottom: -80px; right: -80px; width: 300px; height: 300px; background: radial-gradient(circle, rgba(147,51,234,0.2) 0%, rgba(0,0,0,0) 70%); pointer-events: none; z-index: 1; }
    .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(228, 0, 117, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(228, 0, 117, 0.05) 1px, transparent 1px); background-size: 24px 24px; pointer-events: none; z-index: 1; }
    .bg-lines { position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, transparent, transparent 15px, rgba(228, 0, 117, 0.02) 15px, rgba(228, 0, 117, 0.02) 16px); pointer-events: none; z-index: 1; }
    .corner-dec-top { position: absolute; top: 12px; left: 12px; right: 12px; height: 2px; background: linear-gradient(90deg, #e40075, transparent, #e40075); opacity: 0.6; z-index: 2; }

    /* 头部 Header 放大并拉开间距 */
    .poster-header { text-align: center; position: relative; z-index: 2; margin-bottom: 24px; flex-shrink: 0; }
    .brand-logo-container { margin-bottom: 8px; display: flex; justify-content: center; align-items: center; min-height: 60px; }
    .brand-logo { max-height: 65px; max-width: 220px; object-fit: contain; filter: drop-shadow(0 0 14px rgba(228, 0, 117, 0.7)); }

    .badge-wrapper { display: flex; justify-content: center; margin-bottom: 8px; }
    .badge { 
      display: inline-block; padding: 5px 16px; background: rgba(228, 0, 117, 0.15); 
      border: 1px solid #e40075; border-radius: 20px; font-size: 11px; font-weight: 700; 
      color: #ff66b3; letter-spacing: 2px; box-shadow: 0 0 10px rgba(228, 0, 117, 0.3); 
      text-transform: uppercase; white-space: nowrap; line-height: 1.2;
    }
    .poster-title { font-size: 26px; font-weight: 900; letter-spacing: 2px; color: #ff3399; filter: drop-shadow(0px 0px 8px #e40075); }

    /* 榜单主体下移与间距拉大 */
    .rank-list { flex: 1; display: flex; flex-direction: column; gap: 10px; z-index: 2; justify-content: flex-start; overflow: hidden; }

    /* 表头 */
    .list-header {
      display: flex; align-items: center; padding: 7px 12px; background: rgba(228, 0, 117, 0.12);
      border: 1px solid rgba(228, 0, 117, 0.25); border-radius: 6px; font-size: 11px; font-weight: 700;
      color: #ff66b3; gap: 6px; margin-bottom: 4px;
    }
    .header-col-rank { width: 26px; text-align: center; flex-shrink: 0; }
    .header-col-name { width: 65px; flex-shrink: 0; }
    .header-col-stats { display: flex; flex: 1; justify-content: space-around; text-align: center; }
    .header-col-stats span { flex: 1; }

    /* 单一容器展示当前页卡片（拉大卡片间距 gap） */
    .page-items-container { display: flex; flex-direction: column; gap: 11px; flex-shrink: 0; }

    /* 卡片通用样式（增加 padding 填充空间） */
    .rank-item { 
      display: flex; align-items: center; padding: 10px 12px; background: #160a1d; 
      border: 1px solid rgba(228, 0, 117, 0.3); border-radius: 8px; position: relative; min-width: 0; gap: 6px;
    }
    .top-1 { background: #2d0520; border: 1px solid #e40075; box-shadow: 0 0 10px rgba(228, 0, 117, 0.4); }
    .top-2 { background: #22071a; border: 1px solid rgba(228, 0, 117, 0.7); }
    .top-3 { background: #1b0816; border: 1px solid rgba(228, 0, 117, 0.5); }

    .rank-badge { 
      width: 26px; height: 26px; display: flex; align-items: center; justify-content: center; 
      font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 13px; border-radius: 6px; 
      background: rgba(255,255,255,0.08); color: #8b8b9e; flex-shrink: 0;
    }
    .top-1 .rank-badge { background: #e40075; color: #fff; box-shadow: 0 0 8px #e40075; }
    .top-2 .rank-badge { background: #ffffff; color: #000; }
    .top-3 .rank-badge { background: rgba(228, 0, 117, 0.4); color: #ff66b3; border: 1px solid #e40075; }

    .rank-name { font-size: 14px; font-weight: 700; width: 65px; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex-shrink: 0; }
    .top-1 .rank-name { color: #fff; filter: drop-shadow(0 0 5px #e40075); }

    .data-group { display: flex; align-items: center; justify-content: space-around; flex: 1; min-width: 0; }
    .data-item { display: flex; align-items: center; justify-content: center; flex: 1; }
    .data-item .val { font-family: 'Orbitron', sans-serif; font-size: 15px; font-weight: 900; color: #e2e8f0; line-height: 1; }
    .data-item.main-stat .val { color: #ff3399; font-size: 18px; filter: drop-shadow(0 0 5px rgba(228,0,117,0.7)); }
    .top-1 .data-item.main-stat .val { color: #ffffff; filter: drop-shadow(0 0 8px #e40075); }

    /* 底部 Footer */
    .poster-footer { z-index: 2; text-align: center; margin-top: auto; padding-top: 10px; flex-shrink: 0; display: flex; justify-content: center; align-items: center; gap: 12px; }
    .poster-date { font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700; color: #ff66b3; letter-spacing: 2px; background: rgba(228,0,117,0.1); padding: 4px 18px; border-radius: 20px; border: 1px solid rgba(228,0,117,0.4); }
    .page-indicator { font-family: 'Orbitron', sans-serif; font-size: 11px; font-weight: 700; color: #8b8b9e; }
  </style>
</head>
<body>

  <div class="control-panel">
    <h2>⚡ 战报数据录入</h2>

    <div class="form-group">
      <label>顶部小标签（副标题）</label>
      <input type="text" id="input-badge" value="🔥 DAILY STORE VISIT LOG" oninput="saveAndRender()">
    </div>

    <div class="form-group">
      <label>海报主标题</label>
      <input type="text" id="input-title" value="每日跑店记录" oninput="saveAndRender()">
    </div>
    
    <div class="form-group">
      <label>自定义海报背景图</label>
      <input type="file" id="input-bg" accept="image/*" onchange="changeBg(event)">
      <button class="btn btn-danger" onclick="clearBg()">🗑️ 清除自定义背景</button>
    </div>

    <div class="form-group">
      <label>榜单日期</label>
      <input type="text" id="input-date" oninput="saveAndRender()">
    </div>

    <div class="form-group">
      <label>批量粘贴数据（从 Excel 复制 4 列）</label>
      <div style="font-size: 11px; color: #ff66b3; margin-bottom: 4px;">格式：姓名 进店数 跑店数 邀人进群数</div>
      <textarea id="input-raw-data" rows="10" placeholder="姓名 进店 跑店 邀人" oninput="saveAndRender()"></textarea>
    </div>

    <button class="btn btn-primary" onclick="saveAndRender()">🔄 生成战报预览</button>
    <button class="btn btn-success" onclick="downloadCurrentPage()">📸 导出当前页图片</button>
    <button class="btn btn-batch" onclick="downloadAllPages()">📦 一键批量导出所有页</button>
  </div>

  <div class="preview-panel">
    <div class="pagination-bar">
      <button class="page-btn" id="btn-prev" onclick="changePage(-1)">◀ 上一页</button>
      <span class="page-info" id="page-text">第 1 / 1 页</span>
      <button class="page-btn" id="btn-next" onclick="changePage(1)">下一页 ▶</button>
    </div>

    <div id="poster">
      <img id="custom-bg-img" class="custom-bg-layer" src="" alt="bg">
      <div class="bg-overlay" id="bg-overlay"></div>
      <div class="bg-light-1"></div>
      <div class="bg-light-2"></div>
      <div class="bg-grid"></div>
      <div class="bg-lines"></div>
      <div class="corner-dec-top"></div>

      <div class="poster-header">
        <div class="brand-logo-container">
          <img src="logo.png" alt="Brand Logo" class="brand-logo" id="logo-img" onerror="this.style.display='none'">
        </div>
        <div class="badge-wrapper">
          <div class="badge" id="display-badge">🔥 DAILY STORE VISIT LOG</div>
        </div>
        <div class="poster-title" id="display-title">每日跑店记录</div>
      </div>

      <div class="rank-list">
        <div class="list-header">
          <div class="header-col-rank">NO</div>
          <div class="header-col-name">姓名</div>
          <div class="header-col-stats">
            <span>进店</span>
            <span>跑店</span>
            <span>邀群</span>
          </div>
        </div>

        <div class="page-items-container" id="items-box"></div>
      </div>

      <div class="poster-footer">
        <div class="poster-date" id="display-date">2026.08.10</div>
        <div class="page-indicator" id="footer-page-indicator">PAGE 1/1</div>
      </div>
    </div>
  </div>

  <script>
    const defaultData = "张伟 22 15 15\n李娜 18 13 10\n王强 15 10 10\n刘洋 12 0 0\n陈杰 10 0 0\n赵敏 9 0 0\n孙伟 8 0 0\n周杰 7 0 0\n王二 6 0 0\n张三 4 0 0\n李四 2 0 0";
    
    const PAGE_SIZE = 8; // 每页固定 8 名
    let currentPage = 1;
    let totalPages = 1;
    let globalListData = [];

    window.onload = function() {
      document.getElementById('input-badge').value = localStorage.getItem('poster_badge') || '🔥 DAILY STORE VISIT LOG';
      document.getElementById('input-title').value = localStorage.getItem('poster_title') || '每日跑店记录';
      document.getElementById('input-date').value = localStorage.getItem('poster_date') || '2026.08.10';
      document.getElementById('input-raw-data').value = localStorage.getItem('poster_raw_data') || defaultData;

      const savedBg = localStorage.getItem('poster_bg_image');
      if (savedBg) applyBgImage(savedBg);

      saveAndRender();
    };

    function saveAndRender() {
      const badgeVal = document.getElementById('input-badge').value;
      const titleVal = document.getElementById('input-title').value;
      const dateVal = document.getElementById('input-date').value;
      const rawText = document.getElementById('input-raw-data').value;

      localStorage.setItem('poster_badge', badgeVal);
      localStorage.setItem('poster_title', titleVal);
      localStorage.setItem('poster_date', dateVal);
      localStorage.setItem('poster_raw_data', rawText);

      parseData();
      renderPage();
    }

    function parseData() {
      const rawText = document.getElementById('input-raw-data').value.trim();
      globalListData = [];
      if (!rawText) return;

      const lines = rawText.split('\n');
      lines.forEach(line => {
        const parts = line.trim().split(/\s+/);
        if (parts.length >= 2) {
          globalListData.push({
            name: parts[0],
            inStore: parseInt(parts[1]) || 0,
            visitStore: parseInt(parts[2]) || 0,
            inviteGroup: parseInt(parts[3]) || 0
          });
        }
      });

      // 排序
      globalListData.sort((a, b) => b.inStore - a.inStore);

      // 计算连续并列排名
      let currentRank = 1;
      globalListData.forEach((item, index) => {
        if (index > 0 && item.inStore < globalListData[index - 1].inStore) {
          currentRank++;
        }
        item.rank = currentRank;
      });

      totalPages = Math.ceil(globalListData.length / PAGE_SIZE) || 1;
      if (currentPage > totalPages) currentPage = totalPages;
    }

    function renderPage() {
      document.getElementById('display-badge').innerText = document.getElementById('input-badge').value || '🔥 DAILY STORE VISIT LOG';
      document.getElementById('display-title').innerText = document.getElementById('input-title').value || '每日跑店记录';
      document.getElementById('display-date').innerText = document.getElementById('input-date').value;

      // 更新翻页条状态
      document.getElementById('page-text').innerText = `第 ${currentPage} / ${totalPages} 页`;
      document.getElementById('footer-page-indicator').innerText = `PAGE ${currentPage}/${totalPages}`;
      document.getElementById('btn-prev').disabled = (currentPage === 1);
      document.getElementById('btn-next').disabled = (currentPage === totalPages);

      const itemsBox = document.getElementById('items-box');
      itemsBox.innerHTML = '';

      // 获取当前页切片数据
      const startIndex = (currentPage - 1) * PAGE_SIZE;
      const pageData = globalListData.slice(startIndex, startIndex + PAGE_SIZE);

      pageData.forEach(item => {
        const rank = item.rank;
        let topClass = '';
        if (rank === 1) topClass = 'top-1';
        else if (rank === 2) topClass = 'top-2';
        else if (rank === 3) topClass = 'top-3';

        const itemHtml = `
          <div class="rank-item ${topClass}">
            <div class="rank-badge">${rank}</div>
            <div class="rank-name">${item.name}</div>
            <div class="data-group">
              <div class="data-item main-stat">
                <span class="val">${item.inStore}</span>
              </div>
              <div class="data-item">
                <span class="val">${item.visitStore}</span>
              </div>
              <div class="data-item">
                <span class="val">${item.inviteGroup}</span>
              </div>
            </div>
          </div>
        `;
        itemsBox.insertAdjacentHTML('beforeend', itemHtml);
      });
    }

    function changePage(delta) {
      currentPage += delta;
      renderPage();
    }

    function changeBg(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgBase64 = e.target.result;
          applyBgImage(imgBase64);
          localStorage.setItem('poster_bg_image', imgBase64);
        };
        reader.readAsDataURL(file);
      }
    }

    function applyBgImage(imgUrl) {
      const bgImg = document.getElementById('custom-bg-img');
      const overlay = document.getElementById('bg-overlay');
      bgImg.src = imgUrl;
      bgImg.style.display = 'block';
      overlay.style.display = 'block';
    }

    function clearBg() {
      localStorage.removeItem('poster_bg_image');
      const bgImg = document.getElementById('custom-bg-img');
      const overlay = document.getElementById('bg-overlay');
      bgImg.src = '';
      bgImg.style.display = 'none';
      overlay.style.display = 'none';
      document.getElementById('input-bg').value = '';
    }

    // 导出单页
    function exportSingleNode(pageIndex) {
      return new Promise((resolve, reject) => {
        const node = document.getElementById('poster');
        const scale = 2;
        const param = {
          width: node.offsetWidth * scale,
          height: node.offsetHeight * scale,
          style: {
            transform: 'scale(' + scale + ')',
            transformOrigin: 'top left',
            width: node.offsetWidth + 'px',
            height: node.offsetHeight + 'px'
          }
        };

        domtoimage.toPng(node, param).then(dataUrl => {
          const link = document.createElement('a');
          const titleVal = document.getElementById('input-title').value || '战报';
          const dateVal = document.getElementById('input-date').value || '';
          link.download = `${titleVal}_${dateVal}_第${pageIndex}页.png`;
          link.href = dataUrl;
          link.click();
          resolve();
        }).catch(err => reject(err));
      });
    }

    function downloadCurrentPage() {
      exportSingleNode(currentPage);
    }

    async function downloadAllPages() {
      const originalPage = currentPage;
      for (let i = 1; i <= totalPages; i++) {
        currentPage = i;
        renderPage();
        await new Promise(r => setTimeout(r, 200));
        await exportSingleNode(i);
      }
      currentPage = originalPage;
      renderPage();
    }
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日跑店排行榜生成器</title>
  <script src="https://cdn.bootcdn.net/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans SC', sans-serif; background: #080b11; color: #fff; display: flex; gap: 30px; padding: 30px; min-height: 100vh; }
    
    /* 左侧控制面板 */
    .control-panel { width: 340px; background: #121824; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.08); height: fit-content; }
    .control-panel h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #f8fafc; border-bottom: 1px solid #1e293b; padding-bottom: 12px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; font-weight: 500; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px 14px; background: #0a0e17; border: 1px solid #1e293b; border-radius: 8px; color: #fff; outline: none; font-size: 13px; font-family: inherit; }
    .form-group input:focus, .form-group textarea:focus { border-color: #3b82f6; box-shadow: 0 0 0 2px rgba(59,130,246,0.2); }
    .help-text { font-size: 11px; color: #64748b; margin-top: 4px; line-height: 1.4; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; margin-top: 10px; font-size: 14px; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%); color: #fff; box-shadow: 0 4px 12px rgba(37,99,235,0.4); }
    .btn-success { background: linear-gradient(135deg, #10b981 0%, #047857 100%); color: #fff; box-shadow: 0 4px 12px rgba(16,185,129,0.4); }

    /* 右侧预览区 */
    .preview-panel { flex: 1; display: flex; justify-content: center; align-items: flex-start; }
    
    /* 海报主体结构 */
    #poster { 
      width: 420px; 
      height: 780px; 
      background: #0d111a; 
      color: #fff; 
      padding: 45px 24px 30px; 
      position: relative; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
      border-radius: 4px;
    }

    /* 背景装饰层 */
    .bg-light-1 { position: absolute; top: -80px; left: -80px; width: 300px; height: 300px; background: radial-gradient(circle, rgba(59,130,246,0.3) 0%, rgba(0,0,0,0) 70%); pointer-events: none; }
    .bg-light-2 { position: absolute; bottom: 50px; right: -80px; width: 260px; height: 260px; background: radial-gradient(circle, rgba(245,158,11,0.15) 0%, rgba(0,0,0,0) 70%); pointer-events: none; }
    .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px); background-size: 20px 20px; pointer-events: none; }

    /* 头部 Logo 区域 - 已根据需求调大 */
    .poster-header { text-align: center; position: relative; z-index: 2; margin-bottom: 25px; }
    .brand-logo-container { margin-bottom: 20px; display: flex; justify-content: center; align-items: center; min-height: 80px; }
    .brand-logo { max-height: 85px; max-width: 260px; object-fit: contain; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.6)); }

    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px; background: rgba(59,130,246,0.15); border: 1px solid rgba(59,130,246,0.3); border-radius: 20px; font-size: 11px; font-weight: 700; color: #38bdf8; letter-spacing: 2px; margin-bottom: 12px; }
    .poster-title { font-size: 32px; font-weight: 900; letter-spacing: 3px; background: linear-gradient(180deg, #ffffff 0%, #94a3b8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* 榜单列表区 - 增加 margin-top 确保上方空间充足 */
    .rank-list { flex: 1; display: flex; flex-direction: column; gap: 12px; z-index: 2; justify-content: flex-start; margin-top: 40px; }
    
    .rank-item { display: flex; align-items: center; padding: 12px 18px; background: rgba(22, 29, 45, 0.6); border: 1px solid rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border-radius: 12px; position: relative; }
    .top-1 { background: linear-gradient(90deg, rgba(245,158,11,0.15) 0%, rgba(22,29,45,0.8) 100%); border: 1px solid rgba(245,158,11,0.5); box-shadow: 0 4px 20px rgba(245,158,11,0.15); padding: 16px 18px; }
    .top-2 { background: linear-gradient(90deg, rgba(148,163,184,0.15) 0%, rgba(22,29,45,0.8) 100%); border: 1px solid rgba(148,163,184,0.4); }
    .top-3 { background: linear-gradient(90deg, rgba(217,119,6,0.15) 0%, rgba(22,29,45,0.8) 100%); border: 1px solid rgba(217,119,6,0.4); }

    .rank-badge { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 16px; border-radius: 9px; background: rgba(255,255,255,0.05); color: #64748b; }
    .top-1 .rank-badge { background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%); color: #000; box-shadow: 0 2px 8px rgba(251,191,36,0.4); }
    .top-2 .rank-badge { background: linear-gradient(135deg, #e2e8f0 0%, #94a3b8 100%); color: #000; }
    .top-3 .rank-badge { background: linear-gradient(135deg, #f97316 0%, #c2410c 100%); color: #fff; }

    .rank-name { font-size: 16px; font-weight: 700; flex: 1; margin-left: 16px; color: #f8fafc; }
    .top-1 .rank-name { font-size: 18px; color: #fff; text-shadow: 0 0 10px rgba(255,255,255,0.2); }

    .rank-count { font-family: 'Orbitron', sans-serif; font-size: 22px; font-weight: 900; color: #38bdf8; }
    .top-1 .rank-count { font-size: 26px; color: #fbbf24; text-shadow: 0 0 12px rgba(251,191,36,0.3); }
    .rank-count span { font-size: 11px; font-weight: 500; color: #94a3b8; font-family: 'Noto Sans SC', sans-serif; margin-left: 2px; }

    /* 底部日期区域 - 已按照需求移至最下且清空无用文字 */
    .poster-footer { z-index: 2; text-align: center; margin-top: auto; padding-top: 20px; }
    .poster-date { font-family: 'Orbitron', sans-serif; font-size: 14px; font-weight: 700; color: #475569; letter-spacing: 3px; background: rgba(255,255,255,0.03); display: inline-block; padding: 6px 20px; border-radius: 4px; border: 1px solid rgba(255,255,255,0.05); }
  </style>
</head>
<body>

  <div class="control-panel">
    <h2>⚡ 战报数据录入</h2>
    
    <div class="form-group">
      <label>榜单日期</label>
      <input type="text" id="input-date" value="2026.08.07">
    </div>

    <div class="form-group">
      <label>批量粘贴 Excel 数据（姓名 跑店数）</label>
      <textarea id="input-raw-data" rows="8" placeholder="例如：&#10;张伟 18&#10;李娜 15&#10;王强 12&#10;刘洋 10&#10;陈杰 8"></textarea>
      <div class="help-text">💡 提示：从 Excel 直接选中“姓名”和“数量”两列复制粘贴，自动按由高到低排序显示前7名。</div>
    </div>

    <button class="btn btn-primary" onclick="updatePoster()">🔄 生成高保真预览</button>
    <button class="btn btn-success" onclick="downloadPoster()">📸 导出高清海报图片</button>
  </div>

  <div class="preview-panel">
    <div id="poster">
      <div class="bg-light-1"></div>
      <div class="bg-light-2"></div>
      <div class="bg-grid"></div>

      <div class="poster-header">
        <div class="brand-logo-container">
          <img src="logo.png" alt="Brand Logo" class="brand-logo" id="logo-img" onerror="this.style.display='none'">
        </div>
        <div class="badge">TOP PERFORMERS</div>
        <div class="poster-title">跑店英雄榜</div>
      </div>

      <div class="rank-list" id="rank-container">
        </div>

      <div class="poster-footer">
        <div class="poster-date" id="display-date">2026.08.07</div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('input-raw-data').value = "张伟 22\n李娜 18\n王强 15\n刘洋 12\n陈杰 10\n赵敏 8\n孙伟 6";

    function updatePoster() {
      // 1. 更新底部日期
      const dateVal = document.getElementById('input-date').value;
      document.getElementById('display-date').innerText = dateVal;

      // 2. 解析数据
      const rawText = document.getElementById('input-raw-data').value.trim();
      if (!rawText) return;

      const lines = rawText.split('\n');
      let listData = [];

      lines.forEach(line => {
        const parts = line.trim().split(/\s+/);
        if (parts.length >= 2) {
          const name = parts[0];
          const count = parseInt(parts[1]) || 0;
          listData.push({ name, count });
        }
      });

      listData.sort((a, b) => b.count - a.count);
      listData = listData.slice(0, 7);

      const container = document.getElementById('rank-container');
      container.innerHTML = '';

      listData.forEach((item, index) => {
        const rank = index + 1;
        let topClass = '';
        if (rank === 1) topClass = 'top-1';
        else if (rank === 2) topClass = 'top-2';
        else if (rank === 3) topClass = 'top-3';

        const itemHtml = `
          <div class="rank-item ${topClass}">
            <div class="rank-badge">${rank}</div>
            <div class="rank-name">${item.name}</div>
            <div class="rank-count">${item.count} <span>家</span></div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', itemHtml);
      });
    }

    function downloadPoster() {
      const posterElement = document.getElementById('poster');
      html2canvas(posterElement, {
        scale: 3,
        useCORS: true,
        backgroundColor: null
      }).then(canvas => {
        const link = document.createElement('a');
        const dateVal = document.getElementById('input-date').value;
        link.download = `跑店英雄榜战报_${dateVal}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    window.onload = updatePoster;
  </script>
</body>
</html>

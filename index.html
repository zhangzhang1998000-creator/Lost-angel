<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日跑店排行榜生成器 - 放大字号高清导出版</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/dom-to-image/2.6.0/dom-to-image.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans SC', sans-serif; background: #050308; color: #fff; display: flex; gap: 30px; padding: 30px; min-height: 100vh; align-items: flex-start; }
    
    /* 左侧控制面板 */
    .control-panel { width: 340px; background: #0f0914; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(228, 0, 117, 0.2); border: 1px solid rgba(228, 0, 117, 0.3); height: fit-content; position: sticky; top: 30px; }
    .control-panel h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #f8fafc; border-bottom: 1px solid rgba(228,0,117,0.3); padding-bottom: 12px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: #d1d5db; margin-bottom: 6px; font-weight: 500; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px 14px; background: #050308; border: 1px solid rgba(228,0,117,0.3); border-radius: 8px; color: #fff; outline: none; font-size: 13px; font-family: inherit; }
    .form-group input[type="file"] { padding: 8px 10px; cursor: pointer; }
    .form-group input:focus, .form-group textarea:focus { border-color: #e40075; box-shadow: 0 0 10px rgba(228, 0, 117, 0.4); }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; margin-top: 10px; font-size: 14px; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #e40075 0%, #900048 100%); color: #fff; box-shadow: 0 4px 15px rgba(228,0,117,0.4); }
    .btn-success { background: linear-gradient(135deg, #10b981 0%, #047857 100%); color: #fff; box-shadow: 0 4px 12px rgba(16,185,129,0.4); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; margin-top: 6px; font-size: 12px; padding: 6px; }

    /* 右侧预览区 */
    .preview-panel { flex: 1; display: flex; justify-content: center; align-items: flex-start; }
    
    /* 核心海报容器 */
    #poster { 
      width: 420px; 
      height: 840px; 
      background-color: #09030c; 
      color: #fff; 
      padding: 30px 22px 22px; 
      position: relative; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
      border-radius: 12px;
      border: 1px solid rgba(228, 0, 117, 0.4);
      box-shadow: 0 0 30px rgba(228, 0, 117, 0.2);
    }

    /* 背景图层 */
    .custom-bg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 0;
      display: none;
    }

    /* 背景光效与装饰 */
    .bg-overlay { position: absolute; inset: 0; background: rgba(9, 3, 12, 0.75); pointer-events: none; z-index: 1; display: none; }
    .bg-light-1 { position: absolute; top: -100px; left: 50%; transform: translateX(-50%); width: 360px; height: 360px; background: radial-gradient(circle, rgba(228,0,117,0.35) 0%, rgba(0,0,0,0) 70%); pointer-events: none; z-index: 1; }
    .bg-light-2 { position: absolute; bottom: -80px; right: -80px; width: 300px; height: 300px; background: radial-gradient(circle, rgba(147,51,234,0.2) 0%, rgba(0,0,0,0) 70%); pointer-events: none; z-index: 1; }
    .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(228, 0, 117, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(228, 0, 117, 0.05) 1px, transparent 1px); background-size: 24px 24px; pointer-events: none; z-index: 1; }
    .bg-lines { position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, transparent, transparent 15px, rgba(228, 0, 117, 0.02) 15px, rgba(228, 0, 117, 0.02) 16px); pointer-events: none; z-index: 1; }
    .corner-dec-top { position: absolute; top: 12px; left: 12px; right: 12px; height: 2px; background: linear-gradient(90deg, #e40075, transparent, #e40075); opacity: 0.6; z-index: 2; }

    /* 头部 Header */
    .poster-header { text-align: center; position: relative; z-index: 2; margin-bottom: 12px; flex-shrink: 0; }
    .brand-logo-container { margin-bottom: 6px; display: flex; justify-content: center; align-items: center; min-height: 50px; }
    .brand-logo { max-height: 55px; max-width: 200px; object-fit: contain; filter: drop-shadow(0 0 12px rgba(228, 0, 117, 0.6)); }

    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; background: rgba(228,0,117,0.15); border: 1px solid #e40075; border-radius: 20px; font-size: 11px; font-weight: 700; color: #ff66b3; letter-spacing: 2px; margin-bottom: 4px; box-shadow: 0 0 10px rgba(228,0,117,0.3); text-transform: uppercase; }
    
    .poster-title { 
      font-size: 26px; 
      font-weight: 900; 
      letter-spacing: 3px; 
      color: #ff3399; 
      filter: drop-shadow(0px 0px 8px #e40075);
      word-break: break-word; 
    }

    /* 榜单主体 */
    .rank-list { 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      gap: 8px; 
      z-index: 2; 
      justify-content: flex-start;
      overflow: hidden;
    }

    .top-three-container {
      display: flex;
      flex-direction: column;
      gap: var(--top3-gap, 8px);
      flex-shrink: 0;
    }

    .others-container {
      display: grid;
      gap: var(--other-gap, 6px);
      grid-template-columns: var(--grid-columns, 1fr);
      align-content: start;
    }

    /* 卡片通用样式 */
    .rank-item { 
      display: flex; 
      align-items: center; 
      padding: var(--item-padding, 8px 12px); 
      background: #160a1d; 
      border: 1px solid rgba(228, 0, 117, 0.3); 
      border-radius: 8px; 
      position: relative; 
      min-width: 0;
    }

    .top-1 { background: #2d0520; border: 1px solid #e40075; box-shadow: 0 0 12px rgba(228, 0, 117, 0.5); }
    .top-2 { background: #22071a; border: 1px solid rgba(228, 0, 117, 0.7); }
    .top-3 { background: #1b0816; border: 1px solid rgba(228, 0, 117, 0.5); }

    .rank-badge { 
      width: var(--badge-size, 28px); 
      height: var(--badge-size, 28px); 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-family: 'Orbitron', sans-serif; 
      font-weight: 900; 
      font-size: var(--badge-font, 13px); 
      border-radius: 6px; 
      background: rgba(255,255,255,0.08); 
      color: #8b8b9e; 
      flex-shrink: 0;
    }
    .top-1 .rank-badge { background: #e40075; color: #fff; box-shadow: 0 0 8px #e40075; }
    .top-2 .rank-badge { background: #ffffff; color: #000; }
    .top-3 .rank-badge { background: rgba(228, 0, 117, 0.4); color: #ff66b3; border: 1px solid #e40075; }

    .rank-name { 
      font-size: var(--name-font, 13px); 
      font-weight: 700; 
      flex: 1; 
      margin-left: 8px; 
      color: #f8fafc; 
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .top-1 .rank-name { color: #fff; filter: drop-shadow(0 0 5px #e40075); }

    .rank-count { 
      font-family: 'Orbitron', sans-serif; 
      font-size: var(--count-font, 16px); 
      font-weight: 900; 
      color: #ff66b3; 
      flex-shrink: 0;
      margin-left: 4px;
    }
    .top-1 .rank-count { color: #ffffff; filter: drop-shadow(0 0 8px #e40075); }
    .rank-count span { font-size: var(--unit-font, 10px); font-weight: 500; color: #9ca3af; font-family: 'Noto Sans SC', sans-serif; margin-left: 1px; }

    /* 底部 Footer */
    .poster-footer { z-index: 2; text-align: center; margin-top: auto; padding-top: 8px; flex-shrink: 0; }
    .poster-date { font-family: 'Orbitron', sans-serif; font-size: 12px; font-weight: 700; color: #ff66b3; letter-spacing: 2px; background: rgba(228,0,117,0.1); display: inline-block; padding: 4px 18px; border-radius: 20px; border: 1px solid rgba(228,0,117,0.4); }
  </style>
</head>
<body>

  <div class="control-panel">
    <h2>⚡ 战报数据录入</h2>

    <div class="form-group">
      <label>顶部小标签（副标题）</label>
      <input type="text" id="input-badge" value="🔥 DAILY STORE VISIT LOG" oninput="saveAndRender()">
    </div>

    <div class="form-group">
      <label>海报主标题</label>
      <input type="text" id="input-title" value="每日跑店记录" oninput="saveAndRender()">
    </div>
    
    <div class="form-group">
      <label>自定义海报背景图</label>
      <input type="file" id="input-bg" accept="image/*" onchange="changeBg(event)">
      <button class="btn btn-danger" onclick="clearBg()">🗑️ 清除自定义背景</button>
    </div>

    <div class="form-group">
      <label>榜单日期</label>
      <input type="text" id="input-date" oninput="saveAndRender()">
    </div>

    <div class="form-group">
      <label>批量粘贴 Excel 数据</label>
      <textarea id="input-raw-data" rows="11" placeholder="直接粘贴任意多行数据..." oninput="saveAndRender()"></textarea>
    </div>

    <button class="btn btn-primary" onclick="saveAndRender()">🔄 生成高保真预览</button>
    <button class="btn btn-success" onclick="downloadPoster()">📸 导出高清海报图片</button>
  </div>

  <div class="preview-panel">
    <div id="poster">
      <img id="custom-bg-img" class="custom-bg-layer" src="" alt="bg">

      <div class="bg-overlay" id="bg-overlay"></div>
      <div class="bg-light-1"></div>
      <div class="bg-light-2"></div>
      <div class="bg-grid"></div>
      <div class="bg-lines"></div>
      <div class="corner-dec-top"></div>

      <div class="poster-header">
        <div class="brand-logo-container">
          <img src="logo.png" alt="Brand Logo" class="brand-logo" id="logo-img" onerror="this.style.display='none'">
        </div>
        <div class="badge" id="display-badge">🔥 DAILY STORE VISIT LOG</div>
        <div class="poster-title" id="display-title">每日跑店记录</div>
      </div>

      <div class="rank-list" id="rank-container">
        <div class="top-three-container" id="top3-box"></div>
        <div class="others-container" id="others-box"></div>
      </div>

      <div class="poster-footer">
        <div class="poster-date" id="display-date">2026.08.10</div>
      </div>
    </div>
  </div>

  <script>
    const defaultData = "张伟 22\n李娜 18\n王强 15\n刘洋 12\n陈杰 10\n赵敏 9\n孙伟 8\n周杰 7\n王二 6\n张三 4\n李四 2";

    window.onload = function() {
      const savedBadge = localStorage.getItem('poster_badge') || '🔥 DAILY STORE VISIT LOG';
      document.getElementById('input-badge').value = savedBadge;

      const savedTitle = localStorage.getItem('poster_title') || '每日跑店记录';
      document.getElementById('input-title').value = savedTitle;

      const savedDate = localStorage.getItem('poster_date') || '2026.08.10';
      document.getElementById('input-date').value = savedDate;

      const savedRawData = localStorage.getItem('poster_raw_data') || defaultData;
      document.getElementById('input-raw-data').value = savedRawData;

      const savedBg = localStorage.getItem('poster_bg_image');
      if (savedBg) {
        applyBgImage(savedBg);
      }

      updatePoster();
    };

    function saveAndRender() {
      const badgeVal = document.getElementById('input-badge').value;
      const titleVal = document.getElementById('input-title').value;
      const dateVal = document.getElementById('input-date').value;
      const rawText = document.getElementById('input-raw-data').value;

      localStorage.setItem('poster_badge', badgeVal);
      localStorage.setItem('poster_title', titleVal);
      localStorage.setItem('poster_date', dateVal);
      localStorage.setItem('poster_raw_data', rawText);

      updatePoster();
    }

    function changeBg(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgBase64 = e.target.result;
          applyBgImage(imgBase64);
          localStorage.setItem('poster_bg_image', imgBase64);
        };
        reader.readAsDataURL(file);
      }
    }

    function applyBgImage(imgUrl) {
      const bgImg = document.getElementById('custom-bg-img');
      const overlay = document.getElementById('bg-overlay');
      bgImg.src = imgUrl;
      bgImg.style.display = 'block';
      overlay.style.display = 'block';
    }

    function clearBg() {
      localStorage.removeItem('poster_bg_image');
      const bgImg = document.getElementById('custom-bg-img');
      const overlay = document.getElementById('bg-overlay');
      bgImg.src = '';
      bgImg.style.display = 'none';
      overlay.style.display = 'none';
      document.getElementById('input-bg').value = '';
    }

    function updatePoster() {
      const badgeVal = document.getElementById('input-badge').value || '🔥 DAILY STORE VISIT LOG';
      const titleVal = document.getElementById('input-title').value || '每日跑店记录';
      const dateVal = document.getElementById('input-date').value;
      
      document.getElementById('display-badge').innerText = badgeVal;
      document.getElementById('display-title').innerText = titleVal;
      document.getElementById('display-date').innerText = dateVal;

      const rawText = document.getElementById('input-raw-data').value.trim();
      if (!rawText) return;

      const lines = rawText.split('\n');
      let listData = [];

      lines.forEach(line => {
        const parts = line.trim().split(/\s+/);
        if (parts.length >= 2) {
          const name = parts[0];
          const count = parseInt(parts[1]) || 0;
          listData.push({ name, count });
        }
      });

      listData.sort((a, b) => b.count - a.count);

      const totalCount = listData.length;
      const top3Box = document.getElementById('top3-box');
      const othersBox = document.getElementById('others-box');
      const rankListContainer = document.getElementById('rank-container');

      top3Box.innerHTML = '';
      othersBox.innerHTML = '';

      const isDoubleColumn = totalCount > 8;

      if (isDoubleColumn) {
        // 放大后的双排尺寸配置
        rankListContainer.style.setProperty('--grid-columns', '1fr 1fr');
        rankListContainer.style.setProperty('--top3-gap', '6px');
        rankListContainer.style.setProperty('--other-gap', '6px');
        rankListContainer.style.setProperty('--item-padding', '7px 10px'); // 适当加大高度
        rankListContainer.style.setProperty('--badge-size', '26px');      // 序号背景框变大
        rankListContainer.style.setProperty('--badge-font', '13px');
        rankListContainer.style.setProperty('--name-font', '14px');       // 名字字号调大到 14px
        rankListContainer.style.setProperty('--count-font', '18px');      // 数字调大到 18px
        rankListContainer.style.setProperty('--unit-font', '11px');       // 单位“家”字号
      } else {
        // 单排模式配置
        rankListContainer.style.setProperty('--grid-columns', '1fr');
        rankListContainer.style.setProperty('--top3-gap', '8px');
        rankListContainer.style.setProperty('--other-gap', '8px');
        rankListContainer.style.setProperty('--item-padding', '10px 14px');
        rankListContainer.style.setProperty('--badge-size', '30px');
        rankListContainer.style.setProperty('--badge-font', '14px');
        rankListContainer.style.setProperty('--name-font', '15px');
        rankListContainer.style.setProperty('--count-font', '20px');
        rankListContainer.style.setProperty('--unit-font', '12px');
      }

      listData.forEach((item, index) => {
        const rank = index + 1;
        let topClass = '';
        if (rank === 1) topClass = 'top-1';
        else if (rank === 2) topClass = 'top-2';
        else if (rank === 3) topClass = 'top-3';

        const itemHtml = `
          <div class="rank-item ${topClass}">
            <div class="rank-badge">${rank}</div>
            <div class="rank-name">${item.name}</div>
            <div class="rank-count">${item.count} <span>家</span></div>
          </div>
        `;

        if (rank <= 3) {
          top3Box.insertAdjacentHTML('beforeend', itemHtml);
        } else {
          othersBox.insertAdjacentHTML('beforeend', itemHtml);
        }
      });
    }

    // 导出门函数
    function downloadPoster() {
      const node = document.getElementById('poster');
      
      const scale = 2;
      const param = {
        width: node.offsetWidth * scale,
        height: node.offsetHeight * scale,
        style: {
          transform: 'scale(' + scale + ')',
          transformOrigin: 'top left',
          width: node.offsetWidth + 'px',
          height: node.offsetHeight + 'px'
        }
      };

      domtoimage.toPng(node, param).then(function (dataUrl) {
        const link = document.createElement('a');
        const titleVal = document.getElementById('input-title').value || '战报';
        const dateVal = document.getElementById('input-date').value || '';
        link.download = `${titleVal}_${dateVal}.png`;
        link.href = dataUrl;
        link.click();
      }).catch(function (error) {
        console.error('导出失败: ', error);
      });
    }
  </script>
</body>
</html>

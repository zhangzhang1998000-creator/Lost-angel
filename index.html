<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>每日跑店排行榜生成器</title>
  <script src="https://cdn.bootcdn.net/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Noto+Sans+SC:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Noto Sans SC', sans-serif; background: #050308; color: #fff; display: flex; gap: 30px; padding: 30px; min-height: 100vh; }
    
    /* 左侧控制面板 */
    .control-panel { width: 340px; background: #0f0914; padding: 25px; border-radius: 16px; box-shadow: 0 10px 30px rgba(228, 0, 117, 0.2); border: 1px solid rgba(228, 0, 117, 0.3); height: fit-content; }
    .control-panel h2 { font-size: 18px; font-weight: 700; margin-bottom: 20px; color: #f8fafc; border-bottom: 1px solid rgba(228,0,117,0.3); padding-bottom: 12px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; color: #d1d5db; margin-bottom: 6px; font-weight: 500; }
    .form-group input, .form-group textarea { width: 100%; padding: 10px 14px; background: #050308; border: 1px solid rgba(228,0,117,0.3); border-radius: 8px; color: #fff; outline: none; font-size: 13px; font-family: inherit; }
    .form-group input[type="file"] { padding: 8px 10px; cursor: pointer; }
    .form-group input:focus, .form-group textarea:focus { border-color: #e40075; box-shadow: 0 0 10px rgba(228, 0, 117, 0.4); }
    .help-text { font-size: 11px; color: #9ca3af; margin-top: 4px; line-height: 1.4; }
    .btn { width: 100%; padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: 700; margin-top: 10px; font-size: 14px; transition: all 0.2s; }
    .btn-primary { background: linear-gradient(135deg, #e40075 0%, #900048 100%); color: #fff; box-shadow: 0 4px 15px rgba(228,0,117,0.4); }
    .btn-success { background: linear-gradient(135deg, #10b981 0%, #047857 100%); color: #fff; box-shadow: 0 4px 12px rgba(16,185,129,0.4); }
    .btn-danger { background: rgba(239, 68, 68, 0.15); color: #ef4444; border: 1px solid #ef4444; margin-top: 6px; font-size: 12px; padding: 6px; }

    /* 右侧预览区 */
    .preview-panel { flex: 1; display: flex; justify-content: center; align-items: flex-start; }
    
    /* 海报主体结构 */
    #poster { 
      width: 420px; 
      min-height: 720px; 
      background-color: #09030c; 
      background-size: cover;
      background-position: center;
      color: #fff; 
      padding: 35px 24px 30px; 
      position: relative; 
      overflow: hidden; 
      display: flex; 
      flex-direction: column; 
      border-radius: 12px;
      border: 1px solid rgba(228, 0, 117, 0.4);
      box-shadow: 0 0 30px rgba(228, 0, 117, 0.2);
    }

    /* 背景装饰层 */
    .bg-overlay { position: absolute; inset: 0; background: rgba(9, 3, 12, 0.75); pointer-events: none; z-index: 1; display: none; }
    .bg-light-1 { position: absolute; top: -100px; left: 50%; transform: translateX(-50%); width: 360px; height: 360px; background: radial-gradient(circle, rgba(228,0,117,0.35) 0%, rgba(0,0,0,0) 70%); pointer-events: none; z-index: 1; }
    .bg-light-2 { position: absolute; bottom: -80px; right: -80px; width: 300px; height: 300px; background: radial-gradient(circle, rgba(147,51,234,0.2) 0%, rgba(0,0,0,0) 70%); pointer-events: none; z-index: 1; }
    .bg-grid { position: absolute; inset: 0; background-image: linear-gradient(rgba(228, 0, 117, 0.05) 1px, transparent 1px), linear-gradient(90deg, rgba(228, 0, 117, 0.05) 1px, transparent 1px); background-size: 24px 24px; pointer-events: none; z-index: 1; }
    .bg-lines { position: absolute; inset: 0; background: repeating-linear-gradient(-45deg, transparent, transparent 15px, rgba(228, 0, 117, 0.02) 15px, rgba(228, 0, 117, 0.02) 16px); pointer-events: none; z-index: 1; }
    .corner-dec-top { position: absolute; top: 12px; left: 12px; right: 12px; height: 2px; background: linear-gradient(90deg, #e40075, transparent, #e40075); opacity: 0.6; z-index: 2; }

    /* 头部 Logo 区域 */
    .poster-header { text-align: center; position: relative; z-index: 2; margin-bottom: 20px; }
    .brand-logo-container { margin-bottom: 12px; display: flex; justify-content: center; align-items: center; min-height: 70px; }
    .brand-logo { max-height: 80px; max-width: 240px; object-fit: contain; filter: drop-shadow(0 0 12px rgba(228, 0, 117, 0.6)); }

    /* 标题与标签 */
    .badge { display: inline-flex; align-items: center; gap: 6px; padding: 4px 16px; background: rgba(228,0,117,0.15); border: 1px solid #e40075; border-radius: 20px; font-size: 11px; font-weight: 700; color: #ff66b3; letter-spacing: 2px; margin-bottom: 10px; box-shadow: 0 0 10px rgba(228,0,117,0.3); }
    .poster-title { font-size: 32px; font-weight: 900; letter-spacing: 4px; color: #ffffff; text-shadow: 0 0 10px #e40075, 0 0 20px #e40075, 0 0 30px #e40075; }

    /* 榜单列表区 */
    .rank-list { flex: 1; display: flex; flex-direction: column; gap: 10px; z-index: 2; justify-content: flex-start; margin-top: 10px; margin-bottom: 20px; }
    .rank-item { display: flex; align-items: center; padding: 10px 16px; background: #160a1d; border: 1px solid rgba(228, 0, 117, 0.3); border-radius: 10px; position: relative; }
    .top-1 { background: #2d0520; border: 1px solid #e40075; box-shadow: 0 0 15px rgba(228, 0, 117, 0.5); padding: 13px 16px; }
    .top-2 { background: #22071a; border: 1px solid rgba(228, 0, 117, 0.7); }
    .top-3 { background: #1b0816; border: 1px solid rgba(228, 0, 117, 0.5); }

    .rank-badge { width: 32px; height: 32px; display: flex; align-items: center; justify-content: center; font-family: 'Orbitron', sans-serif; font-weight: 900; font-size: 15px; border-radius: 8px; background: rgba(255,255,255,0.08); color: #8b8b9e; }
    .top-1 .rank-badge { background: #e40075; color: #fff; box-shadow: 0 0 10px #e40075; }
    .top-2 .rank-badge { background: #ffffff; color: #000; }
    .top-3 .rank-badge { background: rgba(228, 0, 117, 0.4); color: #ff66b3; border: 1px solid #e40075; }

    .rank-name { font-size: 15px; font-weight: 700; flex: 1; margin-left: 14px; color: #f8fafc; }
    .top-1 .rank-name { font-size: 17px; color: #fff; text-shadow: 0 0 8px #e40075; }

    .rank-count { font-family: 'Orbitron', sans-serif; font-size: 20px; font-weight: 900; color: #ff66b3; }
    .top-1 .rank-count { font-size: 24px; color: #ffffff; text-shadow: 0 0 10px #e40075; }
    .rank-count span { font-size: 11px; font-weight: 500; color: #9ca3af; font-family: 'Noto Sans SC', sans-serif; margin-left: 2px; }

    /* 底部日期区域 */
    .poster-footer { z-index: 2; text-align: center; margin-top: auto; padding-top: 10px; }
    .poster-date { font-family: 'Orbitron', sans-serif; font-size: 13px; font-weight: 700; color: #ff66b3; letter-spacing: 2px; background: rgba(228,0,117,0.1); display: inline-block; padding: 6px 22px; border-radius: 20px; border: 1px solid rgba(228,0,117,0.4); }
  </style>
</head>
<body>

  <div class="control-panel">
    <h2>⚡ 战报数据录入</h2>
    
    <div class="form-group">
      <label>自定义海报背景图（已支持自动记住）</label>
      <input type="file" id="input-bg" accept="image/*" onchange="changeBg(event)">
      <button class="btn btn-danger" onclick="clearBg()">🗑️ 清除自定义背景</button>
    </div>

    <div class="form-group">
      <label>榜单日期</label>
      <input type="text" id="input-date" oninput="saveAndRender()">
    </div>

    <div class="form-group">
      <label>批量粘贴 Excel 数据（自动保存）</label>
      <textarea id="input-raw-data" rows="8" oninput="saveAndRender()"></textarea>
    </div>

    <button class="btn btn-primary" onclick="saveAndRender()">🔄 生成高保真预览</button>
    <button class="btn btn-success" onclick="downloadPoster()">📸 导出高清海报图片</button>
  </div>

  <div class="preview-panel">
    <div id="poster">
      <div class="bg-overlay" id="bg-overlay"></div>
      <div class="bg-light-1"></div>
      <div class="bg-light-2"></div>
      <div class="bg-grid"></div>
      <div class="bg-lines"></div>
      <div class="corner-dec-top"></div>

      <div class="poster-header">
        <div class="brand-logo-container">
          <img src="logo.png" alt="Brand Logo" class="brand-logo" id="logo-img" onerror="this.style.display='none'">
        </div>
        <div class="badge">🔥 TOP PERFORMERS</div>
        <div class="poster-title">跑店英雄榜</div>
      </div>

      <div class="rank-list" id="rank-container">
      </div>

      <div class="poster-footer">
        <div class="poster-date" id="display-date">2026.08.07</div>
      </div>
    </div>
  </div>

  <script>
    // 默认初始数据
    const defaultData = "张伟 22\n李娜 18\n王强 15\n刘洋 12\n陈杰 10\n赵敏 8\n孙伟 6\n周杰 5";

    // 页面加载完毕后自动读取缓存并渲染
    window.onload = function() {
      // 1. 读取历史保存的日期
      const savedDate = localStorage.getItem('poster_date') || '2026.08.07';
      document.getElementById('input-date').value = savedDate;

      // 2. 读取历史保存的人员数据
      const savedRawData = localStorage.getItem('poster_raw_data') || defaultData;
      document.getElementById('input-raw-data').value = savedRawData;

      // 3. 读取历史保存的背景图
      const savedBg = localStorage.getItem('poster_bg_image');
      if (savedBg) {
        applyBgImage(savedBg);
      }

      // 4. 渲染海报
      updatePoster();
    };

    // 保存并实时渲染
    function saveAndRender() {
      const dateVal = document.getElementById('input-date').value;
      const rawText = document.getElementById('input-raw-data').value;

      // 实时保存到浏览器本地
      localStorage.setItem('poster_date', dateVal);
      localStorage.setItem('poster_raw_data', rawText);

      updatePoster();
    }

    // 上传图片并保存到本地
    function changeBg(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgBase64 = e.target.result;
          applyBgImage(imgBase64);
          // 存入浏览器
          localStorage.setItem('poster_bg_image', imgBase64);
        };
        reader.readAsDataURL(file);
      }
    }

    // 应用背景图片
    function applyBgImage(imgUrl) {
      const poster = document.getElementById('poster');
      const overlay = document.getElementById('bg-overlay');
      poster.style.backgroundImage = `url('${imgUrl}')`;
      overlay.style.display = 'block';
    }

    // 清除自定义背景
    function clearBg() {
      localStorage.removeItem('poster_bg_image');
      const poster = document.getElementById('poster');
      const overlay = document.getElementById('bg-overlay');
      poster.style.backgroundImage = 'none';
      overlay.style.display = 'none';
      document.getElementById('input-bg').value = '';
    }

    // 渲染海报
    function updatePoster() {
      const dateVal = document.getElementById('input-date').value;
      document.getElementById('display-date').innerText = dateVal;

      const rawText = document.getElementById('input-raw-data').value.trim();
      if (!rawText) return;

      const lines = rawText.split('\n');
      let listData = [];

      lines.forEach(line => {
        const parts = line.trim().split(/\s+/);
        if (parts.length >= 2) {
          const name = parts[0];
          const count = parseInt(parts[1]) || 0;
          listData.push({ name, count });
        }
      });

      listData.sort((a, b) => b.count - a.count);

      const container = document.getElementById('rank-container');
      container.innerHTML = '';

      listData.forEach((item, index) => {
        const rank = index + 1;
        let topClass = '';
        if (rank === 1) topClass = 'top-1';
        else if (rank === 2) topClass = 'top-2';
        else if (rank === 3) topClass = 'top-3';

        const itemHtml = `
          <div class="rank-item ${topClass}">
            <div class="rank-badge">${rank}</div>
            <div class="rank-name">${item.name}</div>
            <div class="rank-count">${item.count} <span>家</span></div>
          </div>
        `;
        container.insertAdjacentHTML('beforeend', itemHtml);
      });
    }

    // 导出高清晰图片
    function downloadPoster() {
      const posterElement = document.getElementById('poster');
      
      document.fonts.ready.then(() => {
        html2canvas(posterElement, {
          scale: 3,
          useCORS: true,
          allowTaint: true,
          backgroundColor: '#09030c'
        }).then(canvas => {
          const link = document.createElement('a');
          const dateVal = document.getElementById('input-date').value || '战报';
          link.download = `黑粉战报_${dateVal}.png`;
          link.href = canvas.toDataURL('image/png');
          link.click();
        });
      });
    }
  </script>
</body>
</html>
